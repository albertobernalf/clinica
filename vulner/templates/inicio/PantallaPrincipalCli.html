{% extends "Reportes/cabezaCli.html" %}
{% load static %}


{% block content %}


<input type="hidden" id="username" name="username" value = "{{Username}}">
<input type="hidden" id="sedeSeleccionada" name="sedeSeleccionada" value = "{{SedeSeleccionada}}">

<!--  Estos creo son del Reporteador -->

<input type="hidden" id="numreporte" name="numreporte" value = "{{numreporte}}">
<input type="hidden" id="grupo" name="grupo" value = "{{Grupo}}">
<input type="hidden" id="subGrupo" name="subGrupo" value = "{{SubGrupo}}">

<!--  Estos si de la Aplicacion base -->

<input type="hidden" id="sede" name="sede" value = "{{Sede}}">
<input type="hidden" id="documento" name="documento" value = "{{Documento}}">
<input type="hidden" id="nombreSede" name="nombreSede" value = "{{NombreSede}}">
<input type="hidden" id="profesional" name="profesional" value = "{{Profesional}}">
<input type="hidden" id="permisosGrales" name="permisosGrales" value = "{{PermisosGrales}}">
<input type="hidden" id="permisosDetalle" name="permisosDetalle" value = "{{PermisosDetalle}}">


<div class="elemento">

    <p>   <img src="{% static '/img/ClinicaAlb2.png' %}" alt="Imagen de la clínica" width="80" height="80">  Sede: {{NombreSede}} Usuario: {{Profesional}}

    <span>
      <a href="/retornarAdmision/{{Sede}}, {{Username}}, {{Documento}}, {{NombreSede}}, {{Profesional}} ">RETORNO</a>
        <i class="fa-solid fa-arrow-rotate-left"></i>

      </span>

    </p>

</div>

<div class="contenido">
    {% for permisosGrales in PermisosGrales %}

    <figure class="figure">
        <img src="{% static permisosGrales.logo %}"
             style="width:50px;height:50px;" alt="...">
        <figcaption>
            <a href="/escoge/{{Sede}}, {{Username}}, {{Profesional}}, {{Documento}} ,{{NombreSede}} ,{{permisosGrales.modulo_nombre}} ">
                <button type="button" class="btn btn-info" style="background-color:#424d63"><H6>
                    {{permisosGrales.nombre}}</H6></button>
            </a>
        </figcaption>
    </figure>

    {% endfor %}
</div>

{% endblock %}
